stages:
  - quality
  - build
  - audit
  - container
  - deploy

variables:
  NODE_VERSION: "22"
  CMS_MODE: "mock"
  NEXT_PUBLIC_ALLOW_INDEXING: "false"
  LEAD_STORAGE_MODE: "file"
  ALLOW_FILE_LEAD_STORAGE: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  image: node:${NODE_VERSION}-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node -v
    - npm ci --cache .npm --prefer-offline

.quality_needs: &quality_needs
  needs: []

lint:
  stage: quality
  <<: *quality_needs
  script:
    - npm run lint

typecheck:
  stage: quality
  <<: *quality_needs
  script:
    - npm run typecheck

unit-test:
  stage: quality
  <<: *quality_needs
  script:
    - npm run test

build:
  stage: build
  needs:
    - lint
    - typecheck
    - unit-test
  script:
    - npm run build
    - node scripts/prepare-standalone.mjs
  artifacts:
    name: "standalone-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - .next/standalone/
      - .next/static/
      - public/
      - db/
      - scripts/migrate.mjs
      - scripts/validate-runtime.mjs
      - docker-entrypoint.sh

lighthouse:
  stage: audit
  needs:
    - build
  script:
    - npm run build
    - npx lhci autorun
  artifacts:
    name: "lighthouse-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    when: always
    paths:
      - .lighthouseci/
  allow_failure: false

container-image:
  stage: container
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - build
    - lighthouse
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    KANIKO_STUB: "true"
  script:
    - |
      echo "Kaniko container build stub — configure CI_REGISTRY_IMAGE and secrets before production use."
      mkdir -p /kaniko/.docker
      if [ -n "${CI_REGISTRY_USER:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
      fi
      DESTINATIONS="--destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} --destination ${CI_REGISTRY_IMAGE}:latest"
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg "NEXT_PUBLIC_ALLOW_INDEXING=false" \
        --build-arg "CMS_MODE=mock" \
        --build-arg "STRAPI_BUILD_API_TOKEN=${STRAPI_BUILD_API_TOKEN:-}" \
        ${DESTINATIONS} \
        --cache=true || {
          echo "Kaniko executor unavailable or registry not configured — stub passed for starter scaffold."
          exit 0
        }

sprint2-preflight:
  stage: deploy
  <<: *quality_needs
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      if [ -f intake/sprint2-intake.json ]; then
        node scripts/sprint2-preflight.mjs --strict
      else
        echo "No intake/sprint2-intake.json in CI — report-only preflight"
        node scripts/sprint2-preflight.mjs || true
        npm run check:demo
      fi

staging-deploy:
  stage: deploy
  needs:
    - build
    - lighthouse
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Staging deploy manual job — configure runner + registry on target host"
    - echo "See docs/STAGING-DEPLOY.md"
    - test -f .env.staging.example
    - node scripts/sprint2-preflight.mjs || true
    - npm run check:demo
    - |
      echo "Artifacts: .next/standalone from build job"
      echo "On host: docker compose -f docker-compose.staging.yml up -d --build"
      echo "Smoke: npm run staging:smoke (STAGING_URL=https://staging.example.com)"
  artifacts:
    reports:
      dotenv: []
  allow_failure: false
