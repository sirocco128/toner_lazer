# Local Postgres for Sprint 1 Strapi CMS (P1-CMS-001 local path).
# MinIO stores images (public) and customer/ops documents (private vault).
# Strapi itself runs on the host from ./cms after bootstrap — see docs/SPRINT1-LOCAL-CMS.md
#
#   docker compose up -d postgres mysql minio minio-replica minio-init minio-mirror
#   npm run cms:bootstrap
#   cd cms && npm install && npm run develop
#
# MinIO API: http://127.0.0.1:9020  Console: http://127.0.0.1:9021
# Replica API: http://127.0.0.1:9022  Console: http://127.0.0.1:9023
# Host 9000/9001 is often taken (genesis-minio). Override with MINIO_HOST_API_PORT.
# Console login is MINIO_ROOT_* . The Next.js app must use MINIO_ACCESS_KEY (giftset-app).
# ClamAV (optional): npm run vault:up — host 13310 because 3310 is often TMS MySQL.

services:
  postgres:
    image: postgres:16-alpine
    container_name: giftset-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: giftset
      POSTGRES_USER: giftset
      POSTGRES_PASSWORD: giftset
    volumes:
      - giftset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftset -d giftset"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: giftset-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: biz_secret
      MYSQL_DATABASE: smartgift
      MYSQL_USER: biz
      MYSQL_PASSWORD: biz_secret
    volumes:
      - giftset_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubiz", "-pbiz_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: giftset-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_API_PORT:-9020}:9000"
      - "${MINIO_HOST_CONSOLE_PORT:-9021}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terabis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terabisMinioDev1}
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY:-giftset-dev:ymytN68ifaCKY+kmOVGz98/wmv+ogeEGFz8sKs/SjoA=}"
    volumes:
      - giftset_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: giftset-minio-init
    depends_on:
      - minio
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terabis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terabisMinioDev1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-giftset-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-giftsetAppDevKey1}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-terabis-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-terabis-public}
      MINIO_BUCKET_CONFIDENTIAL: ${MINIO_BUCKET_CONFIDENTIAL:-terabis-confidential}
      MINIO_BUCKET_RESTRICTED: ${MINIO_BUCKET_RESTRICTED:-terabis-restricted}
      MINIO_RETENTION_DAYS: ${MINIO_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - "tr -d '\\r' < /init.sh > /tmp/init-lf.sh && exec /bin/sh /tmp/init-lf.sh"

  minio-replica:
    image: minio/minio:latest
    container_name: giftset-minio-replica
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_REPLICA_API_PORT:-9022}:9000"
      - "${MINIO_REPLICA_CONSOLE_PORT:-9023}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terabis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terabisMinioDev1}
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY:-giftset-dev:ymytN68ifaCKY+kmOVGz98/wmv+ogeEGFz8sKs/SjoA=}"
    volumes:
      - giftset_minio_replica:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  minio-mirror:
    image: minio/mc:latest
    container_name: giftset-minio-mirror
    depends_on:
      - minio
      - minio-replica
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terabis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terabisMinioDev1}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-terabis-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-terabis-public}
      MINIO_BUCKET_CONFIDENTIAL: ${MINIO_BUCKET_CONFIDENTIAL:-terabis-confidential}
      MINIO_BUCKET_RESTRICTED: ${MINIO_BUCKET_RESTRICTED:-terabis-restricted}
    volumes:
      - ./scripts/minio-mirror.sh:/mirror.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - "tr -d '\\r' < /mirror.sh > /tmp/mirror-lf.sh && exec /bin/sh /tmp/mirror-lf.sh"

  clamav:
    image: clamav/clamav:1.4
    container_name: giftset-clamav
    restart: unless-stopped
    ports:
      - "${CLAMD_HOST_PORT:-13310}:3310"
    volumes:
      - giftset_clamav:/var/lib/clamav

volumes:
  giftset_mysql:
  giftset_pgdata:
  giftset_minio:
  giftset_minio_replica:
  giftset_clamav:
